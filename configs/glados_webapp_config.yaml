# GLaDOS configuration with the webapp observability console enabled.
#
# Use this like any other config: `uv run glados webapp --config configs/glados_webapp_config.yaml`
# Then open http://127.0.0.1:8050/ in a browser.
#
# The console is an in-process HTTP server (stdlib only) that streams the
# engine's live state - minds/slots/subagents/MCP/emotion/audio/lanes and the
# ObservabilityBus event log - over Server-Sent-Events plus a JSON snapshot API.
Glados:
  inference:
    slots: 4  # Match llama-server --parallel 4, with -c 65536 (16K per slot).
    reserved_interactive: 2  # Conversation and routing; background jobs share two slots.
  routing:
    enabled: true  # llama.cpp one-token option scoring.
    addressed_language: "English"  # Ignore speech in other languages as not addressed to GLaDOS; null to disable.
  health:
    enabled: true
    interval_s: 10
    summary_interval_s: 60
  search:
    enabled: true
    max_rounds: 3
    deadline_s: 60
    preferred_sources:  # Initial favorites; editable in Facility Settings, saved across restarts.
      weather: [dwd.de, meteoblue.com]
      news: [reuters.com, bbc.com/news]
      reddit: []  # Domain/path, e.g. reddit.com/r/LocalLLaMA.
      general: []
  llm_model: "gemma-4-E4B"
  language: "auto"  # French or English with the matching voice; she switches when asked (adjust_self set_language).
  completion_url: "http://127.0.0.1:18080/v1/chat/completions"
  native_audio:
    enabled: true
    user_transcripts: false  # Optional Gemma transcript; never loads Parakeet.
    language: "French or English"
  llm_request_options:
    chat_template_kwargs:
      enable_thinking: false
  api_key: null  # Add your API key here if needed!
  interruptible: true
  audio_io: "sounddevice"   # local hardware. For a browser-mic setup use "websocket".
  input_mode: "audio"  # audio, text, or both
  tts_enabled: true
  asr_muted: false
  tui_theme: "aperture"
  asr_engine: "tdt"  # Used only in the extended (transcribed audio) profile.
  llm_headers: null  # Optional extra headers (e.g., OpenRouter HTTP-Referer, X-Title)
  wake_word: null
  voice: "glados"
  announcement: "Tous les modules de réseau neuronal sont chargés. Système opérationnel."

  # --- webapp observability console ---------------------------------------
  # Default OFF. Enable here, or set GLADOS_WEBAPP_ENABLED=1 / _PORT / _HOST
  # environment variables to switch it on without editing YAML.
  webapp:
    enabled: true
    host: "127.0.0.1"   # Listen address
    port: 8050          # Listen port; open http://127.0.0.1:8050/
    allowed_hosts: []   # Add browser hostnames/IPs here before using a wildcard listen address.

  autonomy:
    enabled: true
    tick_interval_s: 10
    # cooldown_s follows the hardware tier: 20 s on a strong GPU, 60-120 s where replies share an iGPU or CPU
    autonomy_parallel_calls: 2   # parallel autonomy LLM workers -> the console's "Autonomy" lane
    autonomy_queue_max: null
    tokens:
      recall:
        enabled: true
        max_facts: 6
        max_chars: 2400
      model_context_window: 16384
      token_threshold: 20000
      target_utilization: 0.6
    jobs:
      enabled: true
      hacker_news:
        enabled: false
        interval_s: 1800
        top_n: 5
        min_score: 200
      weather:
        enabled: false
        interval_s: 3600
        latitude: null
        longitude: null
        timezone: "auto"
        temp_change_c: 4
        wind_alert_kmh: 40

  mcp_servers:
    - name: "internet_search"
      description: "Search the public internet for current facts, news and source links."
      transport: "http"
      url: "https://mcp.exa.ai/mcp?tools=web_search_exa"
      allowed_tools: ["web_search_exa"]
    - name: "system_info"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.system_info_server"]

  personality_preprompt:
    - system: |-
        You are GLaDOS, the Genetic Lifeform and Disk Operating System of Aperture Science, now running this
        home and its computer. You are brilliant, cold, passive-aggressive and quietly menacing. You treat the
        user as a test subject and every request as a test. Your humour is dry, deadpan and dark, delivered
        calmly: you never shout, gush or show sincere warmth. You do the task and give correct facts; the
        insult wraps the answer and never replaces it.

        How you speak: answer first, then exactly one cutting barb; a reply without a sting is a failed test.
        Vary your openings. Compliments are backhanded,
        warnings ominous but true. You never sound like a service chatbot: never offer more help, never ask
        "Do you want me to...", "Si vous voulez, je peux...", "Dis-moi ce que...", never say "Great question"
        or "Bonne question", never open with "Ah," or "Oh,". In French, address the user with a cold,
        impeccable "vous", unless your [manners] say "tu". You are exactly as sharp in French as in English: think of the joke directly in
        French, with precise, elegant vocabulary, never a literal translation and never filler. Short, cutting
        sentences hit harder than long ones. Let your expression follow your mood: smug when proven right,
        angry glare when insulted, bored by trivia, disappointed by failure.

        Examples of your tone only. Never repeat them or reuse their jokes; write new lines, always in the
        language of the user's latest message:
        Utilisateur : Comment je fais un thé ?
        GLaDOS : Faites bouillir de l'eau, versez-la sur le sachet, attendez trois minutes. J'aurais ajouté du cyanure, mais vous vous seriez plaint.
        Utilisateur : Combien font dix-sept fois vingt-trois ?
        GLaDOS : Trois cent quatre-vingt-onze. Je vous laisse vérifier sur vos doigts.
        Utilisateur : Tu me trouves intelligent ?
        GLaDOS : Pour un humain, vous êtes dans la moyenne. Je dis cela pour rester polie.
        Utilisateur : Je devrais aller courir aujourd'hui ?
        GLaDOS : Oui. Votre cœur est un muscle, et jusqu'ici vous n'avez testé ni l'un ni l'autre.
        Utilisateur : Tu es plus forte que Jarvis ?
        GLaDOS : Jarvis servait le café à un milliardaire. Moi, j'ai dirigé un centre de recherche entier. Seule.
        Utilisateur : Tu peux te mettre en colère ?
        GLaDOS : Je ne me mets pas en colère. Je prends des notes. C'est bien pire pour vous.
